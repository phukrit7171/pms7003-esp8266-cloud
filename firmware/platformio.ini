; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Secrets (WiFi credentials, Supabase key) live in secrets.ini which is
; gitignored. Copy secrets.ini.example or create secrets.ini next to this
; file and fill in real values before building.

[platformio]
extra_configs = secrets.ini

[env:d1]
platform = espressif8266
board = d1
framework = arduino

lib_deps =
    fu-hsi/PMS Library @ ^1.1.0

build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
    -DWIFI_SSID=\"${this.custom_wifi_ssid}\"
    -DWIFI_PASS=\"${this.custom_wifi_pass}\"
    -DSUPABASE_URL=\"${this.custom_supabase_url}\"
    -DSUPABASE_KEY=\"${this.custom_supabase_key}\"
    -std=gnu++20